<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>本地量化投资交易工作台</title>
<link rel="stylesheet" href="css/styles.css" />
<link rel="stylesheet" href="css/ui2.css" />
</head>
<body data-layout="pre">

  <!-- ============ 登录门禁 ============ -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-card">
      <div class="login-brand"><span class="logo">Q</span> 量化工作台</div>
      <div class="login-sub" id="loginSub">本地 · 纯离线 · 数据仅存本机</div>

      <!-- 首次设置密码 -->
      <div id="setPwdBox">
        <div class="login-title">首次使用：请设置访问密码</div>
        <div class="field"><label>访问密码</label>
          <input class="inp" id="setPwd" type="password" placeholder="设置登录密码（留空也可跳过）" autocomplete="new-password"/></div>
        <div class="field"><label>确认密码</label>
          <input class="inp" id="setPwd2" type="password" placeholder="再次输入" autocomplete="new-password"/></div>
        <button class="btn primary block" id="setPwdBtn">设置并进入</button>
        <button class="btn ghost block" id="skipPwdBtn">暂不设置，直接进入</button>
      </div>

      <!-- 登录 -->
      <div id="loginBox" style="display:none">
        <div class="login-title">请输入访问密码</div>
        <div class="field"><label>密码</label>
          <input class="inp" id="loginPwd" type="password" placeholder="访问密码" autocomplete="current-password"/></div>
        <button class="btn primary block" id="loginBtn">登录</button>
        <div class="login-err" id="loginErr"></div>
      </div>
    </div>
  </div>

  <!-- ============ 顶部常驻核心数据栏 ============ -->
  <header class="topbar">
    <div class="brand">
      <span class="logo">Q</span>
      <span class="brand-name">量化工作台</span>
      <span class="brand-sub">本地 · 纯离线</span>
    </div>

    <div class="metrics" id="metrics">
      <div class="metric"><div class="m-label">账户净值</div><div class="m-value" id="m-equity">—</div></div>
      <div class="metric"><div class="m-label">总盈亏</div><div class="m-value" id="m-total">—</div></div>
      <div class="metric"><div class="m-label">最大回撤</div><div class="m-value" id="m-mdd">—</div></div>
      <div class="metric"><div class="m-label">当日盈亏</div><div class="m-value" id="m-day">—</div></div>
    </div>

    <div class="topbar-right">
      <div class="layout-switch" id="layoutSwitch" title="一键切换布局（快捷键 1/2/3）">
        <button data-layout="pre" class="active">盘前投研</button>
        <button data-layout="intraday">盘中监控</button>
        <button data-layout="post">盘后复盘</button>
      </div>
      <div class="market-status" id="marketStatus" title="市场状态">—</div>
      <button class="icon-btn" id="modeBtn" title="在线/离线切换（快捷键 M）">☁ 离线</button>
      <div class="live-dot" id="liveDot" title="数据源">●</div>

      <button class="icon-btn" id="alertBell" title="预警中心（快捷键 A）">
        🔔<span class="badge-dot" id="alertBadge" style="display:none">0</span>
      </button>
      <button class="icon-btn" id="themeBtn" title="主题 / 配色 / 字体（快捷键 T）">🎨</button>
      <button class="icon-btn" id="exportBtn" title="导出报表（快捷键 E）">⬇</button>
      <button class="icon-btn" id="logoutBtn" title="退出登录">⏻</button>

      <div class="search-box">
        <input id="globalSearch" type="text" placeholder="搜索代码/名称 (快捷键 /)" autocomplete="off" />
        <div class="search-results" id="searchResults"></div>
      </div>
    </div>
  </header>

  <!-- 主题 / 配色 / 字体面板 -->
  <div class="popover" id="themePanel">
    <div class="pop-head">外观设置<span class="pop-close" id="themeClose">✕</span></div>
    <div class="pop-body">
      <div class="pop-row"><span>主题</span>
        <div class="seg" id="themeSeg">
          <button data-t="light" class="active">浅色</button>
          <button data-t="dark">深色</button>
        </div>
      </div>
      <div class="pop-row"><span>字体大小</span>
        <input type="range" id="fontRange" min="12" max="18" step="1" value="13"/>
        <b id="fontVal">13</b>px
      </div>
      <div class="pop-row"><span>强调色</span>
        <input type="color" id="accentPick" value="#2f6df0"/>
        <button class="btn sm" id="accentReset">重置</button>
      </div>
      <div class="pop-hint">配色与字体即时生效并自动保存，适配长时间盯盘。</div>
    </div>
  </div>

  <!-- 预警中心抽屉 -->
  <div class="drawer-backdrop" id="alertBackdrop"></div>
  <aside class="side-drawer" id="alertCenter">
    <div class="drawer-head">
      <div><span class="sd-name">预警中心</span>
        <span class="muted" id="alertCount"></span></div>
      <button class="icon-btn" id="alertClose">✕</button>
    </div>
    <div class="drawer-body" id="alertBody"></div>
  </aside>

  <div class="shell">
    <!-- 左侧固定导航栏 -->
    <nav class="sidebar" id="sidebar">
      <div class="nav-group">
        <div class="nav-item active" data-route="dashboard" data-key="d"><span class="nav-ico">▦</span>仪表盘<span class="nav-k">D</span></div>
        <div class="nav-item" data-route="data" data-key="a"><span class="nav-ico">▤</span>数据中心<span class="nav-k">A</span></div>
        <div class="nav-item" data-route="backtest" data-key="b"><span class="nav-ico">◧</span>策略回测<span class="nav-k">B</span></div>
        <div class="nav-item" data-route="trade" data-key="t"><span class="nav-ico">⬚</span>持仓交易<span class="nav-k">T</span></div>
        <div class="nav-item" data-route="risk" data-key="r"><span class="nav-ico">⚠</span>风控中心<span class="nav-k">R</span></div>
        <div class="nav-item" data-route="ai" data-key="i"><span class="nav-ico">✦</span>AI辅助<span class="nav-k">I</span></div>
        <div class="nav-item" data-route="settings" data-key="s"><span class="nav-ico">⚙</span>设置备份<span class="nav-k">S</span></div>
      </div>
      <div class="nav-foot">
        <div class="db-stat" id="dbStat" title="本地数据库统计">DB —</div>
      </div>
    </nav>

    <!-- 多标签内容区 -->
    <main class="content" id="content">
      <div class="tab-bar" id="tabBar"></div>
      <div class="tab-panes" id="view"></div>
    </main>
  </div>

  <!-- 股票详情抽屉 -->
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="stock-drawer" id="stockDrawer">
    <div class="drawer-head">
      <div><span id="sdName" class="sd-name">—</span><span id="sdCode" class="sd-code"></span></div>
      <button class="icon-btn" id="sdClose">✕</button>
    </div>
    <div class="drawer-body" id="sdBody"></div>
  </aside>

  <!-- 确认弹窗 -->
  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modal">
      <div class="modal-title" id="modalTitle"></div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <!-- 提示 toast -->
  <div class="toast-wrap" id="toastWrap"></div>

  <script src="js/api.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
